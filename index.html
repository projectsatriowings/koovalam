      <!-- Section: Three Dimensions of Well-Being -->
      <section id="philosophy" class="content-section">
        <h3>Three Dimensions of Well-Being: Body, Mind &amp; Soul</h3>
        <p>
          Good health has three simple parts. These parts are the body, the mind, and the soul. Like the three leaves of the sacred Bilva tree, they work together. When you care for all three, you feel whole and peaceful.
        </p>
        <div class="dimension-grid">
          <article>
            <h4>Sharira (Body) — Natural Vitality</h4>
            <p>
              We move with gentle yoga postures. We eat fresh, warm vegetarian meals. We breathe clean mountain air to renew our energy.
            </p>
          </article>
          <article>
            <h4>Manas (Mind) — Mental Stillness</h4>
            <p>
              We calm our thoughts with quiet breathing. We sleep deeply with guided rest. We take time away from screens and phone calls.
            </p>
          </article>
          <article>
            <h4>Atman (Soul) — Inner Connection</h4>
            <p>
              We visit quiet old temples. We sit in silence by forest streams. We listen to soft music by the evening fire.
            </p>
          </article>
        </div>
      </section>

      <!-- Section: The Retreat Experience in Wayanad -->
      <section id="experience" class="content-section">
        <h3>The Koovalam Retreat Experience in Wayanad</h3>
        <p>
          Our retreat gives you time to rest. There is no rush here. You wake up to the sound of birds. You see the mist roll over the green hills.
        </p>
        <ul>
          <li><strong>Gentle Yoga and Breath:</strong> We do easy morning stretches. We practice slow breathing to relax the body.</li>
          <li><strong>Nature Walks:</strong> We take peaceful walks through green tea gardens and forest paths.</li>
          <li><strong>Temple Peace:</strong> We visit the quiet Tirunelli Temple in the morning hills.</li>
          <li><strong>Evening Music:</strong> We sit by the campfire and listen to sweet flute tunes and acoustic songs.</li>
        </ul>
      </section>

      <!-- Section: Daily Schedule & Itinerary -->
      <section id="itinerary" class="content-section">
        <h3>Four-Day Retreat Itinerary &amp; Daily Schedule</h3>
        <p>
          Each day gives you a good balance of group time and quiet rest. You can join every session or take quiet time for yourself.
        </p>
        <ol>
          <li>
            <strong>Day 1 — Arrival &amp; Welcome:</strong> Check in after lunch. Settle into your cottage. Drink fresh herbal tea. Meet our team in the evening. Enjoy a warm dinner.
          </li>
          <li>
            <strong>Day 2 — Morning Light &amp; Rest:</strong> Wake up early to see the sunrise above the clouds. Do gentle yoga on the wooden deck. Walk along forest paths. Rest deeply in the afternoon.
          </li>
          <li>
            <strong>Day 3 — Temple &amp; River Visit:</strong> Visit an ancient temple in the morning hills. Sit by clean mountain streams. Learn about local tribes and plants in the afternoon. Listen to flute music by the campfire at night.
          </li>
          <li>
            <strong>Day 4 — Gratitude &amp; Goodbyes:</strong> Start with a gentle stretch. Share your thoughts in a morning circle. Eat a tasty farewell lunch. Leave with a calm mind and happy heart.
          </li>
        </ol>
      </section>

      <!-- Section: Stay, Food & Travel -->
      <section id="stay-travel" class="content-section">
        <h3>Sanctuary Stay, Vegetarian Cuisine &amp; Travel</h3>
        <p>
          You stay at Oxyfarm Resorts in Wayanad. The cottages are clean, airy, and quiet. Each room has large windows with hill views. You will love the pure mountain breeze.
        </p>
        <p>
          Our food is 100% vegetarian. We cook with fresh local farm produce. We use clean water, mild spices, and coconut. The meals are light, tasty, and easy to digest.
        </p>
        <p>
          Reaching the resort is easy. The closest airport is Kannur. The closest rail station is Thalassery. We can help you book a local taxi to the resort.
        </p>
      </section>

          Our pricing is clear and all-inclusive. There are no surprise costs. Everything you need for a restful stay is included:
        </p>
        <ul>
          <li><strong>Twin-Sharing Room:</strong> ₹17,999 per person. You share a large room with two comfortable beds.</li>
          <li><strong>Private Single Room:</strong> ₹26,999 per person. You get your own private room and bath.</li>
        </ul>
        <p>
          Your fee covers your room for three nights. It covers all meals, tea, and clean drinking water. It covers all yoga, walks, temple trips, and retreat materials.
        </p>
      </section>
